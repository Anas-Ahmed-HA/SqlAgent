[project]
name = "sql-agent"
version = "0.1.0"
description = "Chat agent over a SQL MCP server: a plain tool loop with steering, skills and questions"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.54.0",
    "mcp==1.27.2",
    "python-dotenv==1.0.1",
    "openai==2.52.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.uv]
python-preference = "managed"
package = false

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
